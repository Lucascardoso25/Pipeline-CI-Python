
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Análise de código (lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Rodar flake8
        run: flake8 app tests


  qualidade:
    name: Testes de qualidade

    needs: lint

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Executar testes
        run: pytest -v


  cobertura:
    name: Cobertura de código

    needs: qualidade

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Rodar testes com cobertura (mínimo 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80


  seguranca:
    name: Análise de segurança

    needs: cobertura

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Rodar bandit (análise estática de segurança)
        run: bandit -r app -c .bandit.yml

      - name: Rodar gitleaks (detectar segredos/chaves expostas)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

